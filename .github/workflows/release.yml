# Build the Linux CLI/MCP archive and native GUI tester previews on every
# relevant pull request. When the auto-tag cascade invokes this workflow,
# publish those same verified artifacts with one SHA256SUMS file.
name: Release preview

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - gui/src-tauri/Cargo.toml
      - gui/package-lock.json
      - gui/package.json
      - gui/index.html
      - gui/*.ts
      - gui/src/**
      - gui/src-tauri/**
      - 70-neural-dsp-cortex.rules
      - LICENSE
      - LICENSES/**
      - NOTICE
      - THIRD-PARTY-NOTICES.md
      - docs/install.sh
      - s/check-release-runtime
      - s/gui-bundle
      - s/release-preview
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish; leave empty for a preview only.
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish as a GitHub Release.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  CARGO_DIST_VERSION: "0.32.0"
  CARGO_DIST_INSTALLER_SHA256: "b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5"
  TARGET: x86_64-unknown-linux-gnu

jobs:
  preview:
    name: Build Linux x86_64 preview
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-v$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }
          expected="v$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          [[ "$tag" = "$expected" ]] || {
            echo "Release tag $tag does not match Cargo.toml version $expected" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libudev-dev protobuf-compiler
      - name: Install cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/cargo-dist-installer.sh"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" \
            --output "$installer"
          echo "${CARGO_DIST_INSTALLER_SHA256}  $installer" | sha256sum --check --strict
          sh "$installer"
      - name: Verify release plan
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          dist plan --tag "$RELEASE_TAG" --output-format=json > dist-plan.json
          jq -e '
            .ci.github.artifacts_matrix.include | length == 1
            and .[0].targets == ["x86_64-unknown-linux-gnu"]
          ' dist-plan.json >/dev/null
      - name: Build preview archive
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cargo build --locked --profile dist -p cortex-cli -p cortex-mcp
          stage="target/release-preview/cortex-${RELEASE_TAG#v}-${TARGET}"
          rm -rf "$stage"
          mkdir -p "$stage/LICENSES"
          install -m 0755 target/dist/cortex "$stage/cortex"
          install -m 0755 target/dist/cortex-mcp "$stage/cortex-mcp"
          s/check-release-runtime "$stage/cortex" "$stage/cortex-mcp"
          install -m 0644 LICENSE NOTICE THIRD-PARTY-NOTICES.md 70-neural-dsp-cortex.rules "$stage/"
          install -m 0644 LICENSES/* "$stage/LICENSES/"
          archive="target/release-preview/cortex-${RELEASE_TAG#v}-${TARGET}.tar.xz"
          tar -C target/release-preview -cJf "$archive" "${stage##*/}"
          (
            cd target/release-preview
            sha256sum "${archive##*/}" > SHA256SUMS
          )
      - name: Upload preview archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-linux-x86_64-preview
          path: |
            target/release-preview/*.tar.xz
            target/release-preview/SHA256SUMS
            dist-plan.json
          if-no-files-found: error

  gui-preview:
    name: GUI preview (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            package: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            artifact: cortex-gui-linux-x86_64-preview
          - label: macOS arm64 ad-hoc signed
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            package: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifact: cortex-gui-macos-arm64-ad-hoc-signed-preview
          - label: Windows x86_64 unsigned
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            package: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            artifact: cortex-gui-windows-x86_64-unsigned-preview
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.0"
      - name: Install Linux GUI prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Install frontend dependencies
        run: npm ci --prefix gui
      - name: Test native daemon boundary
        run: cargo test --locked -p cortex-host -p cortex-cli --target ${{ matrix.target }}
      - name: Build native GUI package
        shell: bash
        run: s/gui-bundle "${{ matrix.target }}" "${{ matrix.bundle }}"
      - name: Verify package output
        shell: bash
        env:
          PACKAGE_GLOB: ${{ matrix.package }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=( $PACKAGE_GLOB )
          if [[ "${#packages[@]}" -ne 1 || ! -s "${packages[0]}" ]]; then
            echo "Expected exactly one non-empty package matching $PACKAGE_GLOB" >&2
            exit 1
          fi
      - name: Verify Debian package contents
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_GLOB: ${{ matrix.package }}
        run: |
          set -euo pipefail
          package=( $PACKAGE_GLOB )
          [[ "$(dpkg-deb --field "${package[0]}" Architecture)" = amd64 ]]
          contents="$(dpkg-deb --contents "${package[0]}")"
          grep -qE '\./usr/bin/cortex-gui$' <<<"$contents"
          grep -qE '\./usr/bin/cortex$' <<<"$contents"
          grep -qE '\./usr/lib/udev/rules\.d/70-neural-dsp-cortex\.rules$' <<<"$contents"
          control_dir="$RUNNER_TEMP/cortex-deb-control"
          dpkg-deb --control "${package[0]}" "$control_dir"
          grep -q 'udevadm control --reload-rules' "$control_dir/postinst"
          grep -q 'udevadm trigger --action=add --subsystem-match=hidraw' "$control_dir/postinst"
      - name: Verify macOS package contents and signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          PACKAGE_GLOB: ${{ matrix.package }}
        run: |
          set -euo pipefail
          package=( $PACKAGE_GLOB )
          mount_point="$RUNNER_TEMP/cortex-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "${package[0]}" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          shopt -s nullglob
          apps=( "$mount_point"/*.app )
          [[ "${#apps[@]}" -eq 1 ]]
          test -x "${apps[0]}/Contents/MacOS/cortex-gui"
          test -x "${apps[0]}/Contents/MacOS/cortex"
          test -f "${apps[0]}/Contents/Resources/NOTICE"
          file "${apps[0]}/Contents/MacOS/cortex-gui" | grep -q 'arm64'
          file "${apps[0]}/Contents/MacOS/cortex" | grep -q 'arm64'
          codesign --verify --deep --strict "${apps[0]}"
      - name: Verify Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_GLOB: ${{ matrix.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem $env:PACKAGE_GLOB)
          if ($packages.Count -ne 1) { throw "Expected one NSIS package" }
          $install = Start-Process $packages[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }

          $installDir = Join-Path $env:LOCALAPPDATA 'Cortex'
          $cli = Join-Path $installDir 'cortex.exe'
          $gui = Join-Path $installDir 'cortex-gui.exe'
          $uninstaller = Join-Path $installDir 'uninstall.exe'
          foreach ($path in @($cli, $gui, $uninstaller, (Join-Path $installDir 'NOTICE'))) {
            if (-not (Test-Path $path)) { throw "Missing installed payload: $path" }
          }
          function Get-PeMachine([string] $path) {
            $stream = [IO.File]::OpenRead($path)
            try {
              $reader = [IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4
              return $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }
          }
          foreach ($path in @($cli, $gui)) {
            if ((Get-PeMachine $path) -ne 0x8664) { throw "Payload is not Windows x86_64: $path" }
          }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged cortex helper did not run" }

          $lock = [IO.File]::Open($cli, 'Open', 'Read', 'Read')
          try {
            $blockedUpgrade = Start-Process $packages[0].FullName -ArgumentList '/S' -Wait -PassThru
            if ($blockedUpgrade.ExitCode -eq 0) {
              throw "NSIS upgrade did not fail closed while the helper was locked"
            }
          } finally {
            $lock.Dispose()
          }

          $guiProcess = Start-Process $gui -PassThru
          Start-Sleep -Seconds 2
          $guiProcess.Refresh()
          if ($guiProcess.HasExited) { throw "Packaged GUI exited during launch smoke" }
          $upgrade = Start-Process $packages[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "NSIS upgrade failed: $($upgrade.ExitCode)" }
          $guiProcess.Refresh()
          if (-not $guiProcess.HasExited) { throw "Upgrade did not close the installed GUI" }
          foreach ($path in @($cli, $gui, $uninstaller)) {
            if (-not (Test-Path $path)) { throw "Upgrade lost installed payload: $path" }
          }

          $guiProcess = Start-Process $gui -PassThru
          Start-Sleep -Seconds 2
          $guiProcess.Refresh()
          if ($guiProcess.HasExited) { throw "Upgraded GUI exited during launch smoke" }
          $uninstall = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed: $($uninstall.ExitCode)" }
          $guiProcess.Refresh()
          if (-not $guiProcess.HasExited) { throw "Uninstall did not close the installed GUI" }
          foreach ($path in @($cli, $gui, $uninstaller)) {
            if (Test-Path $path) { throw "Uninstall retained payload: $path" }
          }
      - name: Upload native GUI preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  host:
    name: Publish GitHub Release
    needs: [preview, gui-preview]
    if: inputs.tag != ''
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only for CHANGELOG.md at the release tag - the notes source below
      # falls back cleanly if s/version++ had not generated one yet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download verified archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cortex-linux-x86_64-preview
          path: release
      - name: Download native GUI previews
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cortex-gui-*-preview
          path: release/gui
          merge-multiple: true
      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          # dist-plan.json is uploaded from the repository root, so
          # upload-artifact preserves the release-preview directory hierarchy.
          artifact_dir=release/target/release-preview
          if [[ ! -f "$artifact_dir/SHA256SUMS" ]]; then
            echo "Missing $artifact_dir/SHA256SUMS in the downloaded artifact" >&2
            exit 1
          fi
          mapfile -t archives < <(compgen -G "$artifact_dir/*.tar.xz")
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one release archive in $artifact_dir; found ${#archives[@]}" >&2
            exit 1
          fi
          (
            cd "$artifact_dir"
            sha256sum --check --strict SHA256SUMS
          )
          mapfile -t gui_packages < <(compgen -G "release/gui/*")
          if [[ "${#gui_packages[@]}" -ne 3 ]]; then
            echo "Expected exactly three native GUI packages; found ${#gui_packages[@]}" >&2
            exit 1
          fi

          asset_dir=release/assets
          mkdir -p "$asset_dir"
          cp "${archives[@]}" "$asset_dir/"
          for package in "${gui_packages[@]}"; do
            name="${package##*/}"
            cp "$package" "$asset_dir/${name%.*}-preview.${name##*.}"
          done
          (
            cd "$asset_dir"
            sha256sum * > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          mapfile -t release_payloads < <(compgen -G "$asset_dir/*" | grep -v '/SHA256SUMS$')

          # Prefer the git-cliff section s/version++ generated for this exact
          # version; fall back to GitHub's commit-derived notes only when that
          # section does not exist (e.g. before CHANGELOG.md was adopted).
          version="${RELEASE_TAG#v}"
          notes_file="$(mktemp)"
          if [[ -f CHANGELOG.md ]] && grep -q "^## \[${version}\]" CHANGELOG.md; then
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$notes_file"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" --jq .body > "$notes_file"
          fi
          composed_notes="$(mktemp)"
          {
            printf '> [!WARNING]\n'
            printf '> Native GUI assets ending in `-preview` are provisional tester previews. '
            printf 'Linux is the only hardware-verified host; Windows and macOS device paths remain unverified.\n\n'
            cat "$notes_file"
          } > "$composed_notes"
          notes_file="$composed_notes"

          existing_release="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "'"$RELEASE_TAG"'") | [.id, .draft] | @tsv')"
          if [[ -n "$existing_release" ]]; then
            release_id="${existing_release%%$'\t'*}"
            draft="${existing_release#*$'\t'}"
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published and immutable" >&2
              exit 1
            fi
            # A failed upload leaves only a private draft. Replace that draft
            # as a unit because native installers are not reproducible builds.
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
            --notes-file "$notes_file"
          gh release upload "$RELEASE_TAG" "${release_payloads[@]}"
          gh release upload "$RELEASE_TAG" "$asset_dir/SHA256SUMS"
          gh release edit "$RELEASE_TAG" --draft=false
