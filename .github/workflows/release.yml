# Build the Linux archive on every relevant pull request, retaining it for
# inspection. When the auto-tag cascade invokes this workflow, publish that
# same verified archive and its SHA256SUMS file as a GitHub Release.
name: Release preview

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - gui/src-tauri/Cargo.toml
      - 70-neural-dsp-cortex.rules
      - LICENSE
      - LICENSES/**
      - NOTICE
      - THIRD-PARTY-NOTICES.md
      - docs/install.sh
      - s/release-preview
      - .github/workflows/release.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish as a GitHub Release.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_DIST_VERSION: "0.32.0"
  CARGO_DIST_INSTALLER_SHA256: "b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5"
  TARGET: x86_64-unknown-linux-gnu

jobs:
  preview:
    name: Build Linux x86_64 preview
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-v$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }
          expected="v$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          [[ "$tag" = "$expected" ]] || {
            echo "Release tag $tag does not match Cargo.toml version $expected" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libudev-dev protobuf-compiler
      - name: Install cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/cargo-dist-installer.sh"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" \
            --output "$installer"
          echo "${CARGO_DIST_INSTALLER_SHA256}  $installer" | sha256sum --check --strict
          sh "$installer"
      - name: Verify release plan
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          dist plan --tag "$RELEASE_TAG" --output-format=json > dist-plan.json
          jq -e '
            .ci.github.artifacts_matrix.include | length == 1
            and .[0].targets == ["x86_64-unknown-linux-gnu"]
          ' dist-plan.json >/dev/null
      - name: Build preview archive
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cargo build --locked --profile dist -p cortex-cli -p cortex-mcp
          stage="target/release-preview/cortex-${RELEASE_TAG#v}-${TARGET}"
          rm -rf "$stage"
          mkdir -p "$stage/LICENSES"
          install -m 0755 target/dist/cortex "$stage/cortex"
          install -m 0755 target/dist/cortex-mcp "$stage/cortex-mcp"
          install -m 0644 LICENSE NOTICE THIRD-PARTY-NOTICES.md 70-neural-dsp-cortex.rules "$stage/"
          install -m 0644 LICENSES/* "$stage/LICENSES/"
          archive="target/release-preview/cortex-${RELEASE_TAG#v}-${TARGET}.tar.xz"
          tar -C target/release-preview -cJf "$archive" "${stage##*/}"
          (
            cd target/release-preview
            sha256sum "${archive##*/}" > SHA256SUMS
          )
      - name: Upload preview archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-linux-x86_64-preview
          path: |
            target/release-preview/*.tar.xz
            target/release-preview/SHA256SUMS
            dist-plan.json
          if-no-files-found: error

  host:
    name: Publish GitHub Release
    needs: preview
    if: inputs.tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only for CHANGELOG.md at the release tag - the notes source below
      # falls back cleanly if s/version++ had not generated one yet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download verified archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cortex-linux-x86_64-preview
          path: release
      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          test -f release/SHA256SUMS
          mapfile -t archives < <(compgen -G 'release/*.tar.xz')
          test "${#archives[@]}" -eq 1
          (
            cd release
            sha256sum --check --strict SHA256SUMS
          )

          # Prefer the git-cliff section s/version++ generated for this exact
          # version; fall back to GitHub's commit-derived notes only when that
          # section does not exist (e.g. before CHANGELOG.md was adopted).
          version="${RELEASE_TAG#v}"
          notes_args=(--generate-notes)
          if [[ -f CHANGELOG.md ]] && grep -q "^## \[${version}\]" CHANGELOG.md; then
            notes_file="$(mktemp)"
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$notes_file"
            notes_args=(--notes-file "$notes_file")
          fi

          gh release create "$RELEASE_TAG" --target "$RELEASE_TAG" "${notes_args[@]}" \
            "${archives[@]}" release/SHA256SUMS
