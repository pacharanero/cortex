name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable, with rustfmt and clippy)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install protoc and Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            protobuf-compiler

      - name: Install Windows cross-check target
        run: rustup target add x86_64-pc-windows-gnu

      - name: No real device data
        run: s/lint-no-device-data

      - name: Markdown lint
        run: s/markdownlint

      - name: Workspace and GUI manifest versions match
        run: s/check-versions

      - name: Install frontend dependencies
        run: npm ci --prefix gui

      - name: Check fixture and Tauri frontends
        run: npm run check --prefix gui

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (no default features - leaf protocol surface only)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Tests (all features)
        run: cargo test --all

      - name: Tests (leaf engine, no default features)
        run: cargo test --all --no-default-features

      - name: Tauri build boundary (debug, no bundle)
        run: npm run tauri --prefix gui -- build --debug --no-bundle --ci

      - name: Windows host-boundary cross-check
        run: |
          cargo check -p cortex-host --target x86_64-pc-windows-gnu
          cargo check -p cortex-mcp --target x86_64-pc-windows-gnu

  reuse:
    name: REUSE licence lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
