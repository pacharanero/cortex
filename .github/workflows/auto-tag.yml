name: Auto-tag on version bump

# When a push to main bumps the workspace version, create the matching
# `v<version>` tag.
#
# This is the second half of the release contract: `s/version++` lands the
# bump on main and deliberately does NOT tag, so that release authority lives
# in CI rather than on a maintainer's laptop. ci.yml calls this workflow only
# after every blocking job passes on a push to main, so a release cannot race
# a red post-merge check. Re-running that CI invocation is the recovery path.
#
# The tag is created through the API rather than `git push`, because a push
# made with the default GITHUB_TOKEN does not trigger downstream workflows.
# Once release.yml and publish-crates.yml exist (CLI-004.3, CLI-004.4) they
# are invoked from here via `workflow_call` for the same reason - relying on
# the tag push to trigger them would silently never fire.

on:
  workflow_call:

concurrency:
  group: auto-tag-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Detect version bump and create tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      release: ${{ steps.bump.outputs.release }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Two commits, so the previous version can be read for comparison.
          fetch-depth: 2
          persist-credentials: false

      - name: Detect Cargo.toml version change
        id: bump
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every crate takes version.workspace = true, so the workspace
          # version in the root Cargo.toml is the only one that moves.
          new=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          old=$(git show HEAD~1:Cargo.toml 2>/dev/null \
                  | grep -m1 '^version = "' | cut -d'"' -f2 || echo "")

          if [ -z "$new" ]; then
            echo "::warning::Could not read version from Cargo.toml"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$new" = "$old" ]; then
            echo "No version change ($new) - nothing to tag."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$new"
          # A rerun after tag creation must continue into release hosting. It
          # is safe only when the existing tag resolves to this exact commit.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            tagged_commit=$(git rev-list -n 1 "$tag")
            if [ "$tagged_commit" != "$COMMIT_SHA" ]; then
              echo "Existing tag $tag points to $tagged_commit, not $COMMIT_SHA" >&2
              exit 1
            fi
            echo "Tag $tag already exists on the intended commit; continuing release."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Cargo.toml: $old -> $new"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Require protected release environment
        if: steps.bump.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! reviewer_rules=$(gh api "repos/${GITHUB_REPOSITORY}/environments/release" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length'); then
            echo "Create the release environment with a required reviewer before CI may create a release tag." >&2
            exit 1
          fi
          if [ "$reviewer_rules" -lt 1 ]; then
            echo "The release environment must require a reviewer before CI may create a release tag." >&2
            exit 1
          fi

      - name: Create and push tag
        if: steps.bump.outputs.create == 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          tag_object=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" \
            -f message="Release $TAG" \
            -f object="$COMMIT_SHA" \
            -f type=commit \
            --jq .sha)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$tag_object"
          echo "Created $TAG"

  release-preview:
    name: Build release preview
    needs: tag
    if: needs.tag.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
