site_name: cortex
site_description: >-
  An unofficial open-source Quad Cortex and Nano Cortex toolkit developing one
  desktop GUI for Linux, Windows and macOS alongside a CLI, MCP server and
  reusable Rust core.
site_url: https://pacharanero.github.io/cortex/

repo_url: https://github.com/pacharanero/cortex
repo_name: pacharanero/cortex
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: zensical
  variant: modern
  logo: assets/cortex-logo.svg
  features:
    - content.code.copy
    - content.action.edit
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Cross-platform GUI: gui/first-draft.md
  - Install: install.md
  - Agent setup: agent-setup.md
  - MCP tone-building demo: mcp-tone-building-demo.md
  - Walkthrough: walkthrough.md
  - CLI reference: cli-reference.md
  - Protocol:
      - Overview: protocol.md
      - Quad Cortex HID: quad-cortex-hid.md
      - Nano Cortex HID: nano-cortex-hid.md
  - Hardware smoke runbook: runbook-hardware-smoke.md
  - Legal and attribution: legal.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

copyright: >-
  Copyright &copy; 2026 Dr Marcus Baw. Code AGPL-3.0-or-later, documentation
  CC-BY-SA-4.0. Source
  <a href="https://github.com/pacharanero/cortex">pacharanero/cortex</a>.
  Unofficial and not affiliated with Neural DSP Technologies.
