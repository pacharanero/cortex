[package]
name = "cortex-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Low-level Cortex Control USB HID crate and typed domain model for the Neural DSP Quad Cortex; Nano support is planned."

[lib]
name = "cortex_rs"
path = "src/lib.rs"

[features]
default = ["hid"]
# USB HID transport via hidapi. On by default for CLI/MCP/GUI use; disable
# (`default-features = false`) for pure protocol/domain decoding without a
# device present (useful for tests, analysis tools, and a crates.io consumer
# that only wants the schema).
hid = ["dep:hidapi"]
# A scriptable HidLink for tests, so the session, the handshake and anything
# built on them can be exercised without a device. Enabled by dev-dependencies
# of downstream crates that test against a fake session.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
quick-xml = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
prost = { workspace = true }
uuid = { workspace = true }
hidapi = { workspace = true, optional = true }

[dev-dependencies]
# Keep dev-deps minimal so the leaf stays light to build.
serde_json = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
