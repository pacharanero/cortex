[package]
name = "cortex-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line surface for the Neural DSP Quad Cortex over USB HID; Nano Cortex support is planned."

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
cortex-rs = { path = "../cortex-rs" }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
ctrlc = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The same crate with its scriptable HidLink, so the daemon can be exercised
# over a fake session instead of a device.
cortex-rs = { path = "../cortex-rs", features = ["test-support"] }
