# git-cliff configuration (CLI-004.13). Adapted from git-cliff's own published
# default (https://github.com/orhun/git-cliff/blob/v2.13.1/config/cliff.toml)
# rather than written from memory, then trimmed and regrouped against this
# repo's real Conventional Commits history (`git log --oneline`) and checked
# against the house-style `koloki-co/dsc` example.
#
# git-cliff generates CHANGELOG.md; cargo-dist does not generate changelogs
# itself; it only optionally consumes an existing one. `s/version++` runs
# `git cliff` in the version-bump flow whenever this file is present, and
# `.github/workflows/release.yml` extracts the tagged version's section for
# the published GitHub Release. See spec/600-ci-release/spec.md.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here, generated by
[git-cliff](https://git-cliff.org) from Conventional Commits. Do not hand-edit
past entries; re-run `s/version++` (or `git cliff`) instead.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false
# Ordered first-match-wins; the `<!-- N -->` prefixes force a stable display
# order (`group_by` otherwise sorts groups by first-seen commit), and
# `striptags` in the body template above drops them from the rendered text.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^nightly", group = "<!-- 2 -->Overnight Automation" },
    { message = "^docs", group = "<!-- 3 -->Documentation" },
    { message = "^perf", group = "<!-- 4 -->Performance" },
    { message = "^refactor", group = "<!-- 5 -->Refactor" },
    { message = "^test", group = "<!-- 6 -->Testing" },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore\\(deps", skip = true },
    { message = "^chore|^ci", group = "<!-- 7 -->Miscellaneous Tasks" },
    { message = "^revert", group = "<!-- 8 -->Revert" },
    { message = ".*", group = "<!-- 9 -->Other" },
]
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
